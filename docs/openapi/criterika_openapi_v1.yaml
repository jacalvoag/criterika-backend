      required:
      - terminosVersionId
      - avisoVersionId
      - aceptaTerminos
      - reconoceAvisoPresentado
      - consienteFinalidadesIds
      description: Consentimiento específico a finalidades declaradas. Reconocer presentación del aviso no afirma
        que se haya leído íntegramente. IP, usuario y fecha los obtiene el servidor.
    Acceptance:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        aceptadaEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        ip:
          type: string
          minLength: 3
          maxLength: 45
          description: IPv4 o IPv6 validada por el servidor; se obtiene solo desde conexión/proxy confiable.
        terminosVersionId:
          type: string
          format: uuid
        avisoVersionId:
          type: string
          format: uuid
        aceptaTerminos:
          type: boolean
          const: true
        reconoceAvisoPresentado:
          type: boolean
          const: true
        consienteFinalidadesIds:
