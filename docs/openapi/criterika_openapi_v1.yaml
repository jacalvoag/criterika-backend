          minimum: 0
          maximum: 5
        disponibles:
          type: integer
          minimum: 0
          maximum: 5
        reservadas:
          type: integer
          minimum: 0
          maximum: 1
        maximo:
          type: integer
          minimum: 5
          maximum: 5
        proximaRegeneracionEn:
          anyOf:
          - type: string
            format: date-time
            description: Instante UTC RFC 3339, con sufijo Z.
          - type: 'null'
      required:
      - totales
      - disponibles
      - reservadas
      - maximo
      - proximaRegeneracionEn
      description: totales=disponibles+reservadas. Regeneración por vidas realmente perdidas; reservar no reduce
