        de terceros.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Acceso de jugador o administrador; rol y sesión se validan en servidor.
    AdminRefreshCookie:
      type: apiKey
      in: cookie
      name: criterika_admin_refresh
      description: Cookie opaca HttpOnly Secure SameSite=Strict; solo refresh administrativo.
    PrivacyIntakeBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token limitado de entrada ARCO; no intercambiable con BearerAuth.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: 'Cursor opaco devuelto por la misma consulta y filtros; inválido: 400 INVALID_CURSOR.'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
      description: Búsqueda textual. No registrar el valor ni URL completa en logs.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID nuevo por intención; reintentos usan la misma clave y cuerpo. Ver política global, incluida
        ventana de tokens.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
      description: ETag obtenido en GET del recurso correspondiente.
    Csrf:
      name: X-CSRF-Guard
      in: header
      required: true
      schema:
        type: string
        const: '1'
      description: Además validar Origin contra lista del panel web; rechazar petición de origen no permitido.
  responses:
    BadRequest:
      description: Solicitud mal formada, cursor inválido o encabezado de idempotencia ausente.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: BadRequest
            status: 400
            detail: Solicitud mal formada, cursor inválido o encabezado de idempotencia ausente.
            code: INVALID_REQUEST
            requestId: 00000000-0000-4000-8000-000000000001
    Unauthorized:
      description: Credenciales, código, token o sesión no válidos. No revela si existe una cuenta.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer en recursos autenticados.
      content:
        application/problem+json:
          schema:
