openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Criterika — Contrato de API
  version: 1.0.2
  description: |
    Contrato funcional de primera versión, preparado el 15 de noviembre de 2026.

    Estado: especificación para implementación y revisión; no acredita un backend desplegado.
    No reutiliza esquemas ER, MongoDB o SQL descartados. Los schemas describen mensajes HTTP,
    no tablas ni colecciones. El contrato HTTP es independiente del motor; la especificación lógica elige PostgreSQL.

    ## Convenciones
    Rutas en inglés, propiedades de negocio en español y enums en MAYÚSCULAS.
    JSON UTF-8; fechas UTC RFC3339; IDs UUID sin significado de almacenamiento.
    Los errores usan application/problem+json. Rechazar campos desconocidos de entrada.
    Paginación por cursor: limit 20 por defecto, máximo 100; orden estable con ID como desempate.
    No incluir datos personales, tokens o filtros sensibles en logs o URLs.
    Respuestas autenticadas y de autenticación: Cache-Control: no-store.
    X-Request-Id se genera en servidor; los ejemplos son ficticios.

    ## Seguridad
    Bearer de acceso de hasta 15 minutos. El backend valida sesión y permisos en cada petición:
    la validez de la firma del token no sustituye revocación ni sanciones.
    Jugador: refresh opaco rotatorio en JSON, guardado en almacenamiento seguro del dispositivo;
    sesión absoluta de 30 días. Administrador web: refresh en cookie HttpOnly Secure SameSite=Strict,
    Path=/api/v1/admin/auth, sesión absoluta de ocho horas. Panel y API bajo el mismo sitio HTTPS.
    Refresh administrativo requiere X-CSRF-Guard: 1 y Origin permitido, sin CORS con comodín.
    El código administrativo se exige en cada NUEVA sesión, no en cada renovación de acceso.
    El reloj del servidor es la autoridad. Códigos de un uso: 10 minutos, cinco intentos,
    reenvío a partir de 60 segundos; enlace de recuperación: un uso y 10 minutos.
    Contraseñas de 12 a 128 caracteres, sin truncamiento; hash Argon2id.
    Permisos por rol y propiedad del recurso. Recursos de otro jugador devuelven 404.
    Exportación y cancelación requieren confirmación de identidad dentro de los últimos cinco minutos.
    El estado de sanción no impide acceso a privacidad ni a la consulta propia permitida.

    ## Idempotencia y concurrencia
    Toda operación con Idempotency-Key exige UUID aleatorio nuevo por intención del usuario.
    Misma clave + mismo actor/sesión + método/ruta + cuerpo normalizado devuelve el resultado original;
    cuerpo diferente: 409 IDEMPOTENCY_KEY_REUSED. Validar acceso antes de recuperar el resultado.
    La primera ejecución y sus efectos se confirman juntos. Clave en proceso: 409 REQUEST_IN_PROGRESS
    con Retry-After. Retención de respuestas 24 horas, salvo tokens: ventana cifrada de cinco minutos;
    una respuesta perdida de refresh se recupera con MISMA clave y token original dentro de esa ventana,
    sin rotar nuevamente. Después, reutilización de refresh revoca la sesión y exige login.
    No reintentar con clave nueva una operación cuyo resultado se desconoce: consultar el recurso.
    Los resultados de intentos y primeras recompensas conservan unicidad aun después de vencer la caché.
    Una misma clave con una nueva sesión NO identifica una compra anterior: consultar su recibo/movimiento.
    ETag fuerte de recursos administrativos: "v<version>". If-Match obligatorio donde se declara;
    ausente: 428; desactualizado: 412. Solicitudes repetidas se reconocen antes de reevaluar If-Match.

    ## Reglas de juego
    Un intento activo por cuenta. Nivel: 3–6 actividades iniciales; máximo dos por tipo.
    Una ejecución inicial y dos recuperaciones por actividad. Fallo recuperable pasa al final de pendientes;
    tercer fallo termina el nivel. El backend crea la siguiente ejecución dentro de la misma transición;
    ningún GET crea intentos ni ejecuciones. No hay endpoint para que el cliente declare aprobación.
    Respuesta confirmada y errores se aplican una sola vez, no se omiten preguntas/actividades.
    Contenido, orden, criterios, recompensas y derechos de desbloqueo fijados al iniciar.
    Progreso definitivo solo al aprobar el nivel entero; repetir no entrega recompensa inicial.
    Repetición aprobada sí cuenta para racha. Final de unidad: 300 gemas y 250 XP, NO además de normal.
    Normal: 150 gemas y 100 XP. Evoluciones: 150/350/500; vidas 1/3/5: 100/150/250 gemas.
    Economía fija en v1; ajustes justificados no cambian el catálogo de precios o recompensas.
    Cinco vidas totales incluyendo reservadas. Reservar no consume ni activa regeneración.
    Fallo/abandono consume una; aprobar/cancelar libera. Regeneración: una cada 60 minutos mientras falten;
    no reiniciar reloj por otra pérdida o compra, detener al alcanzar cinco, no acumular tiempo sobrante.
    Heartbeat cada 15 segundos; 60 segundos sin comunicación termina como abandono, incluso si un cron
    no lo procesó todavía. No revivir un intento vencido. No reanudar tras cierre/desconexión confirmada.
    Un fallo técnico CONFIRMADO del servicio cancela sin consumir vida; el cliente no decide esa condición.
    Si aprobación ya se confirmó antes de perder la conexión, conservarla y consultar el resultado.

    ## Contenido y publicación
    Una unidad tiene uno o más niveles, exactamente un final al terminar y una carta propia.
    Requisitos secuenciales: no saltar contenido deshabilitado. Estructura de unidad (niveles, orden,
    final, carta y posición del tramo utilizado) fija desde el primer intento; nuevas unidades al final.
    Actividad pertenece a un nivel. Modificar actividades cambia un borrador, no intentos existentes.
    Publicar nivel valida y promueve su composición completa de forma conjunta. Borrador puede ser incompleto.
    Publicar unidad exige niveles y carta publicables completos; publicar carta exige base y tres imágenes
    distintas. Cambios en cartas o términos no retiran adquisiciones legítimas. Definiciones corregidas
    se muestran actualizadas. Deshabilitar no cancela intentos existentes ni borra progreso.
    Nivel final no admite nuevos intentos sin carta publicada válida; una etapa deshabilitada no se compra.
    Imágenes bloqueadas no se entregan, tampoco por acceso directo al mediaId.
    Normalizar mayúsculas/tildes/espacios/puntuación conservando Ñ distinta de N.
    Tableros automáticos con revisión: crucigrama conectado; sopa horizontal/vertical hacia adelante,
    selección en ambos sentidos. Rechazar generación imposible. Sin edición manual de casillas en v1.

    ## Privacidad, auditoría y tareas
    Identidad, fechas e IP de aceptación se obtienen en servidor; solo proxies confiables pueden aportar IP.
    Conservar versiones legales publicadas y evidencia específica; no equiparar aviso con consentimiento.
    Registro sin verificar caduca en 24 horas; no guardar contraseña en claro durante la espera.
    Toda escritura administrativa y su evidencia de autor/cambio se confirman juntas. Si falla auditoría,
    no confirmar la modificación. Actor deriva de sesión; no aceptar administradorId en cuerpos de escritura.
    Bitácora sin secretos o snapshots indiscriminados. Valores personales: solo nombres de campos o
    referencias restringidas cuando basten. Acceso excepcional directo a BD identificado y auditado,
    fuera de las rutas públicas; permisos separados de aplicación, migración y mantenimiento.
    Auditoría 180 días; logs técnicos depurados 30 días; respaldos propios máximo 30 días;
    control mínimo de eliminaciones 60 días, protegido de restauraciones que retrocedan sus registros.
    Al cancelar, retirar datos personales operativos y vínculos de auditoría, salvo bloqueo justificado
    con fundamento y vencimiento. No tratar seudónimos como anonimización automática.
    Aplicar eliminaciones y expiraciones antes de reabrir una restauración; no revivir cuentas.
    Cuentas inactivas: 24 meses, aviso previo mínimo de 30 días; uso autenticado cancela eliminación pendiente.
    Cron diario privado para vencimientos, revisión de inconsistencias y depuración; monitor de intentos
    con frecuencia suficiente más validación de timeout en cada comando. Las tareas no tienen endpoints públicos.
    TLS y cifrado administrado en reposo AES-256 o equivalente, incluidos archivos y respaldos.
    Exportación JSON directa, privada y sin secretos; no guardar exports en URLs públicas ni en logs.
    ARCO: folio, verificación, resolución, ejecución y seguimiento. Controlar veinte días hábiles para
    resolver y quince para ejecutar desde notificación; ampliación justificada una vez por fase.
    Calendario y fundamento de bloqueo requieren validación operativa del responsable real.
    No admitir datos reales hasta configurar responsable, contacto, aviso, proveedores y conservación aplicable.
    Si se usa Brevo: retención mínima de un mes más eventual demora de hasta 24 h; previews desactivadas.

    ## Fuera de alcance
    Pagos reales, publicidad, multijugador, ranking, chat, intercambio de cartas, juego offline,
    configurador de economía, nivel de jugador derivado de XP y un subsistema propio de cifrado por campo.

    ## Precisiones de autorización y revisión
    Cambios legales que requieren aceptación bloquean NUEVOS intentos y compras hasta aceptar;
    no fuerzan pérdida de vida en intentos ya iniciados bajo finalidades aceptadas. Revocación/oposición
    que impide continuar cancela el intento sin consumo y conserva las vías de privacidad.
    Un comando de inicio resuelve primero expiraciones previas. Las consultas no crean/avanzan juego;
    el estado efectivo considera reloj del servidor y la resolución temporal única del servicio de intentos.
    Las adquisiciones históricas son únicas aun si se edita composición futura o cambia texto de un nivel.
    Intentos y recompensas no se identifican por nombre/posición sino por identidad estable de nivel.
    GET de compras devuelve recibo y economía capturada al confirmar; consultar /me/economy para saldo actual.
    Deshabilitación ordinaria de contenido respeta derechos fijados del intento abierto; sanción/revocación
    sí cancela según regla de cuenta. Una respuesta tardía no revierte un resultado final.
    Racha usa zona IANA fijada desde dispositivo al iniciar ese intento; fecha de aprobación viene del
    servidor. Fecha local igual a última aprobada no suma. Fecha posterior inmediata suma; salto reinicia a
    uno. Fecha anterior por cambio de zona no suma, no borra evento ni retrocede última fecha. La zona
    comunicada no es prueba de ubicación, y no se solicita GPS.
    Al borrar datos se eliminan también respuestas de caché/idempotencia que contengan PII, adjuntos,
    miniaturas, referencias y versiones de archivos; no conservarlas solo por completar un TTL técnico.
    La bitácora no es inmutable frente a obligaciones de supresión: solo frente a edición de administradores;
    depuración legal/técnica usa permisos separados y evidencia mínima no identificable cuando sea posible.
    No se solicita RFC, información bancaria ni datos sensibles adicionales para jugar.
    Límites técnicos de v1: 100 unidades, 100 niveles por unidad, 100 actividades en un borrador,
    20 términos por tablero, 20x20 casillas, 12 parejas y 30 preguntas. Publicación mantiene 3–6 actividades.
    Estos límites acotan tamaño/rendimiento; no cambian costos ni criterios educativos acordados.


    Una oposición/revocación aplicada o una fecha de nacimiento rectificada que no cumple elegibilidad puede producir estado RESTRINGIDA con motivos PRIVACIDAD/EDAD_NO_ADMITIDA. Conserva consultas propias y derechos de privacidad. Prioridad del estado efectivo: CANCELACION_EN_PROCESO, BLOQUEADA, SUSPENDIDA, RESTRINGIDA, ACTIVA. Login no elimina restricciones ni revalida consentimiento revocado.


    En operaciones sin requestBody se rechaza un cuerpo no vacío; los comandos no aceptan campos implícitos. La exportación incluye metadatos de sesiones, comunicaciones/rectificaciones del expediente, adjuntos propios conservados y acciones sobre datos del titular, sin datos personales de terceros.
servers:
- url: https://api.criterika.example/api/v1
  description: Marcador de posición; no es un servicio desplegado.
- url: http://localhost:3000/api/v1
  description: Desarrollo local. HTTPS obligatorio en entornos con datos reales.
security:
- BearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - Sistema
      summary: Consultar disponibilidad mínima
      description: Consultar disponibilidad mínima
      x-roles:
      - PUBLICO
      security: []
      responses:
        '200':
          description: Consultar disponibilidad mínima.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  estado:
                    type: string
                    enum:
                    - OK
                  fechaServidor:
                    type: string
                    format: date-time
                    description: Instante UTC RFC 3339, con sufijo Z.
                required:
                - estado
                - fechaServidor
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: PUBLIC
  /legal/documents/current:
    get:
      operationId: getCurrentLegalDocuments
      tags:
      - Legal
      summary: Consultar documentos legales vigentes
      description: Solo versiones publicadas; sin documento vigente/configuración real de privacidad, registro no
        disponible (503 LEGAL_CONFIGURATION_MISSING).
      x-roles:
      - PUBLICO
      security: []
      responses:
        '200':
          description: Consultar documentos legales vigentes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentLegalDocuments'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: PUBLIC
  /legal/documents/{documentVersionId}:
    get:
      operationId: getLegalDocument
      tags:
      - Legal
      summary: Consultar una versión legal publicada
      description: Consultar una versión legal publicada
      x-roles:
      - PUBLICO
      security: []
      parameters:
      - name: documentVersionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Consultar una versión legal publicada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: PUBLIC
  /auth/registrations:
    post:
      operationId: startRegistration
      tags:
      - Autenticación
      summary: Iniciar registro y enviar código
      description: 'No crea todavía un jugador activo. Valida mayoría de edad, documentos y finalidades vigentes.
        Guarda evidencia de la acción con IP/hora del servidor y hash de contraseña pendiente; vincula al verificar.
        Correo existente recibe respuesta genérica equivalente, sin duplicar cuenta ni otorgar sesión. Pendiente
        caduca en 24 h; código en 10 min. LEGAL_VERSION_OUTDATED: 409, solicitar aceptación actualizada explícita.'
      x-roles:
      - PUBLICO
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
            example:
              nombre: Persona
              apellidos: de Ejemplo
              fechaNacimiento: '2000-05-20'
              correo: jugador@example.invalid
              contrasena: Ejemplo-seguro-2026
              aceptacion:
                terminosVersionId: 00000000-0000-4000-8000-000000000010
                avisoVersionId: 00000000-0000-4000-8000-000000000011
                aceptaTerminos: true
                reconoceAvisoPresentado: true
                consienteFinalidadesIds:
                - cuenta
                - aprendizaje
      responses:
        '202':
          description: Iniciar registro y enviar código.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-permission: PUBLIC
  /auth/registrations/{registrationId}/resend:
    post:
      operationId: resendRegistrationCode
      tags:
      - Autenticación
      summary: Reenviar código de registro
      description: Mínimo 60 s, invalida código anterior; nunca extiende el límite absoluto de 24 h del registro
        pendiente.
      x-roles:
      - PUBLICO
      security: []
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Reenviar código de registro.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-permission: PUBLIC
  /auth/registrations/{registrationId}/verify:
    post:
      operationId: verifyRegistration
      tags:
      - Autenticación
      summary: Verificar correo y completar registro
      description: Código vigente de un uso; crea una sola cuenta con cinco vidas, cero gemas, XP y racha. Sin premio
        por reenvío/reintento. Si cambió documento antes de completar, 409 LEGAL_VERSION_OUTDATED y reiniciar aceptación/registro
        explícitamente; no atribuir aceptación de versión no vista.
      x-roles:
      - PUBLICO
      security: []
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeInput'
            example:
              codigo: '123456'
      responses:
        '201':
          description: Verificar correo y completar registro.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-permission: PUBLIC
  /auth/sessions:
    post:
      operationId: createPlayerSession
      tags:
      - Autenticación
      summary: Iniciar sesión de jugador
      description: 'Solo rol JUGADOR. Permite sesión restringida para consultar datos y ejercer privacidad aun con
        suspensión/bloqueo o aceptación pendiente. Usuario desconocido y contraseña incorrecta: mismo 401 INVALID_CREDENTIALS.'
      x-roles:
      - PUBLICO
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            example:
              correo: jugador@example.invalid
              contrasena: Ejemplo-seguro-2026
      responses:
        '200':
          description: Iniciar sesión de jugador.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-permission: PUBLIC
  /auth/refresh:
    post:
      operationId: refreshPlayerSession
      tags:
      - Autenticación
      summary: Renovar acceso de jugador
      description: Refresh opaco rotatorio; no prolonga los 30 días absolutos. Replay perdido solo con misma clave/token
        dentro de cinco minutos; reutilización fuera de esa recuperación revoca sesión. No confundir con token de
        entrada de privacidad.
      x-roles:
      - PUBLICO
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
            example:
              refreshToken: Ejemplo de revisiónxxxxxxxxxxxxx
      responses:
        '200':
          description: Renovar acceso de jugador.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-permission: PUBLIC
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags:
      - Autenticación
      summary: Solicitar recuperación de contraseña
      description: Solicitar recuperación de contraseña
      x-roles:
      - PUBLICO
      security: []
      parameters:
