          - type: string
            format: uuid
          - type: 'null'
        terminosIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 100
      required:
      - gemas
      - xp
      - cartaId
      - terminosIds
    RewardPolicy:
      type: object
      additionalProperties: false
      properties:
        gemas:
          type: integer
          minimum: 0
        xp:
          type: integer
          minimum: 0
        cartaId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        primeraAprobacionPendiente:
          type: boolean
      required:
      - gemas
      - xp
      - cartaId
      - primeraAprobacionPendiente
    ProgressSummary:
      type: object
      additionalProperties: false
      properties:
        unidadesCompletadas:
          type: integer
          minimum: 0
        nivelesCompletados:
          type: integer
          minimum: 0
        siguienteNivelId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        cartasObtenidas:
          type: integer
          minimum: 0
        evolucionesObtenidas:
          type: integer
          minimum: 0
        terminosDesbloqueados:
          type: integer
          minimum: 0
      required:
      - unidadesCompletadas
      - nivelesCompletados
      - siguienteNivelId
      - cartasObtenidas
      - evolucionesObtenidas
      - terminosDesbloqueados
    LevelSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        orden:
          type: integer
          minimum: 1
        tipo:
          type: string
          enum:
          - NORMAL
          - FINAL_UNIDAD
        completado:
          type: boolean
        disponible:
          type: boolean
        motivoNoDisponible:
          anyOf:
          - type: string
            enum:
            - PRERREQUISITO
            - DESHABILITADO
            - UNIDAD_DESHABILITADA
            - CARTA_NO_DISPONIBLE
          - type: 'null'
      required:
      - id
      - nombre
      - orden
      - tipo
      - completado
      - disponible
      - motivoNoDisponible
    UnitSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
        orden:
          type: integer
          minimum: 1
        completada:
          type: boolean
        nivelesCompletados:
          type: integer
          minimum: 0
        niveles:
          type: array
          items:
            $ref: '#/components/schemas/LevelSummary'
          minItems: 1
          maxItems: 100
      required:
      - id
      - nombre
      - descripcion
      - orden
      - completada
      - nivelesCompletados
      - niveles
    LearningPath:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnitSummary'
