    post:
      operationId: submitGameAnswer
      tags:
      - Aprendizaje
      summary: Evaluar una acción y avanzar si corresponde
      description: 'Valida ejecución actual, tipo y pertenencia de IDs; rechaza selección imposible o elemento ya
        resuelto sin contar error. No acepta puntaje/aprobado/saldos. Pregunta confirmada definitiva; feedback inmediato.
        Fallo recuperable agrega misma actividad al final; tercero falla nivel. Todas superadas: aprobación automática
        con recompensa inicial única. Validar sanción/timeout antes de respuesta. 409 EXECUTION_NOT_CURRENT, ANSWER_ALREADY_CONFIRMED
        o ATTEMPT_FINISHED. Repetición de misma intención usa misma clave.'
      x-roles:
      - JUGADOR
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: executionId
