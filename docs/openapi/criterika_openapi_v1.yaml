            format: date
          - type: 'null'
        zonaHoraria:
          type: string
          minLength: 1
          maxLength: 100
          description: Identificador IANA, validado contra el catálogo de zonas del servidor.
      required:
      - dias
      - ultimaFechaLocalAprobada
      - zonaHoraria
    Economy:
      type: object
      additionalProperties: false
