        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
        necesaria:
          type: boolean
          const: true
      required:
      - id
      - descripcion
      - necesaria
      description: 'Primera versión: únicamente finalidades necesarias; no publicidad ni tratamientos secundarios.'
    LegalDocument:
