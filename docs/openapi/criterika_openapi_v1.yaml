        nombre:
          type: string
          minLength: 1
          maxLength: 120
        apellidos:
          type: string
          minLength: 1
          maxLength: 120
        fechaNacimiento:
          type: string
          format: date
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
