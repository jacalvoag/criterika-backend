          maxItems: 30
      required:
      - id
      - usuarioId
      - aceptadaEn
      - ip
      - terminosVersionId
      - avisoVersionId
      - aceptaTerminos
      - reconoceAvisoPresentado
      - consienteFinalidadesIds
    Acceptances:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Acceptance'
