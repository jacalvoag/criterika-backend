x-authorization-policy:
  PUBLIC: 'Solo los endpoints con security: [] son públicos. Rate limit y no enumeración siguen aplicando.'
  PLAY: JUGADOR ACTIVA, finalidad aceptada, intento/nivel propio, snapshot válido y sin timeout. Nueva aceptación
    solo bloquea inicio de nuevos intentos.
  SPEND_GEMS: JUGADOR ACTIVA, aceptación actual y saldo/límites revalidados.
  AUTHENTICATED_OWNER: Sesión válida y propietario. Sanción no impide consulta propia de perfil, progreso, colección,
    diccionario o privacidad.
  ADMIN_MANAGE: ADMINISTRADOR de una de tres cuentas predefinidas; escritura auditada y If-Match donde se declara.
  ADMIN_PRIVACY: ADMINISTRADOR; finalidad de trámite, identidad acreditada antes de entregar/aplicar; confirmación
    reciente en operaciones sensibles.
  ADMIN_AUDIT_READ: ADMINISTRADOR, solo lectura; no incluye credenciales de mantenimiento.
  PRIVACY_SELF_OR_VERIFIED_INTAKE: Identidad de sesión o alcance limitado de intake según security del endpoint.
    No se confunden ambos tokens.
x-acceptance-scenarios:
- caso: Inicio repetido con misma clave
  resultadoEsperado: Un solo intento y una sola reserva.
- caso: Respuesta repetida por pérdida de red
  resultadoEsperado: Un error/avance como máximo; no duplica la actividad en pendientes.
- caso: Una actividad falla dos veces y luego aprueba
  resultadoEsperado: No consume vida; continúa o aprueba el nivel completo.
- caso: Tercer fallo de una actividad
  resultadoEsperado: Termina intento y consume exactamente una vida.
- caso: Cuarta comprobación de crucigrama correcta
  resultadoEsperado: Aprueba si aún no había cuatro comprobaciones incorrectas.
- caso: Actividad nueva del mismo tipo
  resultadoEsperado: Contadores separados por actividad, no por tipo.
- caso: Cinco vidas al iniciar
  resultadoEsperado: Totales 5; disponibles 4; reservadas 1; no comienza regeneración.
- caso: Compra que excede máximo con reserva
  resultadoEsperado: 409 LIFE_CAP_EXCEEDED, sin gasto ni entrega parcial.
- caso: Regeneración y compra simultáneas
  resultadoEsperado: Validación conjunta del estado al confirmar; totales nunca mayores de cinco.
- caso: Timeout ya vencido y heartbeat tardío
  resultadoEsperado: No revive intento; una sola pérdida.
- caso: Última respuesta aprobada antes de corte de red
  resultadoEsperado: Consultar devuelve APROBADO; no se descuenta vida.
- caso: Sanción durante intento
  resultadoEsperado: Cancelación sin consumo ni recompensa; no se reanuda al levantar sanción.
- caso: Publicación de nueva aceptación durante intento
  resultadoEsperado: No fuerza pérdida; bloquea nuevos inicios/compras hasta aceptación.
- caso: Deshabilitación ordinaria con intento abierto
  resultadoEsperado: Conserva contenido y derechos fijados; puede terminar.
- caso: Repetir nivel completado y aprobar
  resultadoEsperado: No da XP/gemas/carta de nuevo; sí puede mantener racha.
- caso: Cambio de fecha local hacia atrás por zona
  resultadoEsperado: No aumenta ni retrocede última fecha de racha.
- caso: Editar recorrido de unidad utilizada
  resultadoEsperado: 409 STRUCTURE_LOCKED; no recalcula aprobaciones.
- caso: Editar actividad durante intento
  resultadoEsperado: Solo cambia borrador/futuros intentos; snapshot activo estable.
- caso: Dos administradores editan misma versión
  resultadoEsperado: Primero confirma; segundo obtiene 412 VERSION_CONFLICT.
- caso: Falla escritura de auditoría
  resultadoEsperado: No se confirma modificación administrativa.
- caso: ID de intento de otro jugador
  resultadoEsperado: 404 sin datos del propietario.
- caso: Acceso directo a imagen de etapa bloqueada
  resultadoEsperado: 404; conocer mediaId no concede acceso.
- caso: Correo verificado por canal alternativo ARCO
  resultadoEsperado: Solo folios/estado propio; no exporta perfil sin identidad acreditada.
- caso: Eliminación con respuesta perdida y sesiones revocadas
  resultadoEsperado: Canal de privacidad permite recuperar estado mínimo sin revivir cuenta.
- caso: Restaurar respaldo con cuenta eliminada
  resultadoEsperado: Reaplicar eliminación antes de operar; no retroceder control ni reiniciar vencimientos.
- caso: Registro con documentos que cambiaron
  resultadoEsperado: 409 LEGAL_VERSION_OUTDATED; no atribuir aceptación de documento no visto.
- caso: Reutilizar refresh tras ventana de recuperación
  resultadoEsperado: Revoca sesión y exige nuevo acceso.
- caso: Bloqueo de cuenta permanente
  resultadoEsperado: No juega ni gasta; mantiene mecanismos para ejercer privacidad.
- caso: Documento publicado corregido
  resultadoEsperado: Nueva versión, sin sobrescribir texto ni aceptaciones históricas.
- caso: Depuración o tercero con pasos pendientes
  resultadoEsperado: Ejecución de cancelación no aparece COMPLETADA hasta resolverlos.
x-operational-gates:
- Identidad y contacto reales del responsable y canal ARCO antes de datos reales.
- Fundamento y calendario aplicables para bloqueo/conservación; los plazos técnicos no son plazos legales.
- Verificar cifrado, TLS, permisos, cuentas administrativas y auditoría del motor que se elija.
- Verificar contratos, ubicación, datos mínimos y borrado de proveedores utilizados.
- Probar restauración con reaplicación de eliminaciones y fallos de tareas.
- Implementar y probar reglas de x-acceptance-scenarios; contrato validado no equivale a backend probado.
x-contract-decisions:
  criterioAceptacion: Funciona, es consistente y justificable, cubre casos importantes con complejidad razonable;
    no exige perfección.
  formato: OpenAPI 3.1.0 autocontenido para Swagger; JSON Schema 2020-12.
  sinModeloPersistencia: true
  defaultsTecnicos:
    accessTokenSegundos: 900
    sesionJugadorDias: 30
    sesionAdministradorHoras: 8
    confirmacionIdentidadSegundos: 300
    idempotenciaHoras: 24
    recuperacionTokensMinutos: 5
    paginacionPredeterminada: 20
    paginacionMaxima: 100
    avatarMaxBytes: 5242880
    evidenciaMaxBytes: 10485760
    dimensionImagenMax: 4096
    registroPendienteHoras: 24
    adjuntosPorSolicitud: 5
    zonaInicialSinActividad: Etc/UTC
  publicacion: Edición de actividad/nivel/carta/término en borrador; promoción explícita protege revisiones en uso.
  auditoria: Escrituras de negocio de cada administrador trazables; eventos de acceso administrativos sin secretos;
    mantenimiento separado identificado.
  tareasPrivadas: No se generan automatizaciones de ChatGPT ni endpoints cron públicos.
