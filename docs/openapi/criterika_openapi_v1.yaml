          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-permission: ADMIN_AUDIT_READ
  /admin/maintenance/status:
    get:
      operationId: getMaintenanceStatus
      tags:
      - Auditoría
      summary: Consultar salud de tareas y eliminaciones
      description: Monitorea tareas privadas; fallos visibles y reintentos seguros. No existe endpoint público para
        ejecutar cron, SQL, restauraciones o depuraciones arbitrarias.
      x-roles:
      - ADMINISTRADOR
      responses:
        '200':
          description: Consultar salud de tareas y eliminaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-permission: ADMIN_AUDIT_READ
  /me/password:
    put:
      operationId: changeMyPassword
      tags:
      - Perfil
      summary: Cambiar contraseña y revocar sesiones anteriores
      description: Verifica contraseña actual, impide reutilizar la misma e invalida todas las sesiones, incluida
        la actual. Si se pierde respuesta, volver a iniciar sesión o recuperar por correo; no se expone contraseña
        en auditoría o caché en claro.
      x-roles:
      - JUGADOR
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                contrasenaActual:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
                  description: Permite espacios y Unicode; no truncar ni registrar. Hash Argon2id en el servidor.
                nuevaContrasena:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
                  description: Permite espacios y Unicode; no truncar ni registrar. Hash Argon2id en el servidor.
              required:
              - contrasenaActual
              - nuevaContrasena
            example:
              contrasenaActual: Ejemplo de revisión
              nuevaContrasena: Ejemplo de revisión
      responses:
        '204':
          description: Cambiar contraseña y revocar sesiones anteriores.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-permission: AUTHENTICATED_OWNER
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          examples:
          - about:blank
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                maxLength: 250
              code:
                type: string
                minLength: 1
                maxLength: 120
              message:
                type: string
                maxLength: 300
            required:
            - path
            - code
            - message
          minItems: 0
          maxItems: 100
      required:
      - type
      - title
      - status
      - detail
      - code
      - requestId
      examples:
      - type: about:blank
        title: Conflicto con el estado actual
        status: 409
        detail: El paquete excede el máximo de cinco vidas, incluida la vida reservada.
        code: LIFE_CAP_EXCEEDED
        requestId: 00000000-0000-4000-8000-000000000001
    ReasonInput:
      type: object
      additionalProperties: false
      properties:
        motivo:
          type: string
          minLength: 10
          maxLength: 500
          description: Motivo necesario y concreto; no incluir secretos ni datos personales innecesarios.
      required:
      - motivo
    Version:
      type: integer
      minimum: 1
      description: 'Versión del recurso para concurrencia. ETag fuerte: "v<version>".'
    AccountStatus:
      type: string
      enum:
      - ACTIVA
      - SUSPENDIDA
      - BLOQUEADA
      - RESTRINGIDA
      - CANCELACION_EN_PROCESO
    UserProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        apellidos:
          type: string
          minLength: 1
          maxLength: 120
        fechaNacimiento:
          type: string
          format: date
        correo:
          type: string
          format: email
          maxLength: 254
        avatarMediaId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        estado:
          $ref: '#/components/schemas/AccountStatus'
        suspensionHasta:
          anyOf:
          - type: string
            format: date-time
            description: Instante UTC RFC 3339, con sufijo Z.
          - type: 'null'
        creadaEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        version:
          $ref: '#/components/schemas/Version'
        restricciones:
          type: array
          items:
            type: string
            enum:
            - PRIVACIDAD
            - EDAD_NO_ADMITIDA
          minItems: 0
          maxItems: 2
          uniqueItems: true
          description: Motivos operativos propios; RESTRINGIDA conserva consultas y mecanismos de privacidad. No
            equivale a sanción ni se levanta automáticamente al iniciar sesión.
      required:
      - id
      - nombre
      - apellidos
      - fechaNacimiento
      - correo
      - avatarMediaId
      - estado
      - suspensionHasta
      - creadaEn
      - version
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        apellidos:
          type: string
          minLength: 1
          maxLength: 120
      required: []
      minProperties: 1
      description: Correo y fecha de nacimiento se rectifican mediante el flujo de privacidad. No admite rol, saldos
        ni progreso.
    AuthCredentials:
      type: object
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Permite espacios y Unicode; no truncar ni registrar. Hash Argon2id en el servidor.
      required:
      - correo
      - contrasena
    ReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        contrasena:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Permite espacios y Unicode; no truncar ni registrar. Hash Argon2id en el servidor.
      required:
      - contrasena
    Reauthentication:
      type: object
      additionalProperties: false
      properties:
        confirmadaEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        validaHasta:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
      required:
      - confirmadaEn
      - validaHasta
      description: Confirmación vinculada a la sesión del servidor durante cinco minutos; no otorga permisos adicionales.
    SessionInfo:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        rol:
          type: string
          enum:
          - JUGADOR
          - ADMINISTRADOR
        creadaEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        expiraEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        esActual:
          type: boolean
      required:
      - id
      - rol
      - creadaEn
      - expiraEn
      - esActual
    Sessions:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
          minItems: 0
          maxItems: 100
        nextCursor:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
      required:
      - items
      - nextCursor
    PlayerSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 32
          maxLength: 4096
        refreshToken:
          type: string
          minLength: 32
          maxLength: 4096
        tokenType:
          type: string
          enum:
          - Bearer
        accessExpiresIn:
          type: integer
          minimum: 1
          maximum: 900
        sessionExpiresAt:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        sessionId:
          type: string
          format: uuid
        usuario:
          $ref: '#/components/schemas/UserProfile'
        requiereNuevaAceptacion:
          type: boolean
      required:
      - accessToken
      - refreshToken
      - tokenType
      - accessExpiresIn
      - sessionExpiresAt
      - sessionId
      - usuario
      - requiereNuevaAceptacion
      description: 'Tokens secretos: Cache-Control no-store; no registrar ni incluir en auditoría. Sesión absoluta
        de 30 días, no deslizante.'
    AdminIdentity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        rol:
          type: string
          enum:
          - ADMINISTRADOR
      required:
      - id
      - nombre
      - rol
    AdminSession:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 32
          maxLength: 4096
        tokenType:
          type: string
          enum:
          - Bearer
        accessExpiresIn:
          type: integer
          minimum: 1
          maximum: 900
        sessionExpiresAt:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        sessionId:
          type: string
          format: uuid
        administrador:
          $ref: '#/components/schemas/AdminIdentity'
      required:
      - accessToken
      - tokenType
      - accessExpiresIn
      - sessionExpiresAt
      - sessionId
      - administrador
      description: Sesión absoluta de ocho horas. Refresh solo en cookie HttpOnly Secure SameSite=Strict; nunca
        se entrega en JSON.
    RefreshInput:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
      required:
      - refreshToken
    CodeInput:
      type: object
      additionalProperties: false
      properties:
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
      required:
      - codigo
    Challenge:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        expiraEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        reenvioDisponibleEn:
          type: string
          format: date-time
          description: Instante UTC RFC 3339, con sufijo Z.
        vigenciaSegundos:
          type: integer
          minimum: 600
          maximum: 600
        maximoIntentos:
          type: integer
          minimum: 5
          maximum: 5
      required:
      - id
      - expiraEn
      - reenvioDisponibleEn
      - vigenciaSegundos
      - maximoIntentos
      description: Identificador opaco no predecible; no revela existencia de cuentas. Un uso; reenvío invalida
        el código anterior.
    EmailInput:
      type: object
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
      required:
      - correo
    ResetPasswordInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
        nuevaContrasena:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Permite espacios y Unicode; no truncar ni registrar. Hash Argon2id en el servidor.
      required:
      - token
      - nuevaContrasena
    Acknowledgement:
      type: object
      additionalProperties: false
      properties:
        mensaje:
          type: string
          maxLength: 300
